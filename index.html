<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d4634" />

    <title>Vinaya Vana</title> 
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // ❌ OLD WAY: nature: { 50: '#f2fbf5', ... } -> This breaks the engine
              // ✅ NEW WAY: nature: { 50: 'var(--color-primary-50)', ... } -> This works
              nature: { 
                50: 'var(--color-primary-50)', 
                100: 'var(--color-primary-100)', 
                200: 'var(--color-primary-200)', 
                300: 'var(--color-primary-300)', 
                400: 'var(--color-primary-400)', 
                500: 'var(--color-primary-500)', 
                600: 'var(--color-primary-600)', 
                700: 'var(--color-primary-700)', 
                800: 'var(--color-primary-800)', 
                900: 'var(--color-primary-900)' 
              },
              earth: { 
                50: 'var(--color-secondary-50)', 
                100: 'var(--color-secondary-100)', 
                800: 'var(--color-secondary-800)', 
                900: 'var(--color-secondary-900)' 
              }
            },
            fontFamily: { 
              sans: ['var(--font-primary)', 'sans-serif'], 
              serif: ['var(--font-secondary)', 'serif'] 
            }
          }
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: var(--font-primary), sans-serif; }
      h1, h2, h3, h4, h5, h6 { font-family: var(--font-secondary), serif; }
      
      /* Google Translate Fix */
      .google-translate-container { display: inline-block; vertical-align: middle; min-width: 120px; min-height: 40px; }
      .goog-te-gadget-simple { 
        background-color: rgba(255, 255, 255, 0.1) !important; 
        border: 1px solid rgba(255, 255, 255, 0.3) !important; 
        padding: 8px 12px !important; 
        border-radius: 9999px !important; 
        font-family: var(--font-primary) !important; 
        display: flex !important; 
        align-items: center; 
        justify-content: center; 
        gap: 6px; 
        cursor: pointer; 
        text-decoration: none !important; 
      }
      .goog-te-gadget-simple:hover { background-color: rgba(255, 255, 255, 0.2) !important; border-color: rgba(255, 255, 255, 0.8) !important; }
      
      .goog-te-gadget-simple .goog-te-menu-value,
      .goog-te-gadget-simple .goog-te-menu-value span { 
        color: var(--color-primary-50) !important; 
        font-weight: 500; 
        font-size: 14px; 
        margin: 0 !important; 
        border-left: none !important;
      }
      
      .goog-te-gadget-simple .goog-te-menu-value span:last-child { display: none !important; }
      .goog-te-gadget-icon, .goog-te-gadget-simple img { display: none !important; }
      .goog-te-banner-frame.skiptranslate { display: none !important; } 
      body { top: 0px !important; }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "axios": "https://esm.sh/axios@^1.13.2"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-nature-50 text-nature-900 antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
